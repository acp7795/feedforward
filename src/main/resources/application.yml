spring:
  application:
    name: videogamedb-api
  
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/videogamedb}
      auto-index-creation: false
  
  session:
    store-type: mongodb
    mongodb:
      collection-name: sessions
    timeout: 1800

server:
  port: 8080
  servlet:
    context-path: /
    session:
      cookie:
        name: VIDEOGAMEDB_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
        max-age: 1800

app:
  encryption:
    key: ${ENCRYPTION_KEY:}
  security:
    pbkdf2-iterations: 310000
    max-login-attempts: 5
    account-lock-minutes: 30
  rate-limit:
    auth-requests-per-minute: 10

logging:
  level:
    root: INFO
    com.videogamedb: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
